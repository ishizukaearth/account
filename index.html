<!DOCTYPE html>
<!-- chatGPTによるコーディング 2026.1.6の表示を一部改変>
<!-- 正規Ver2 ユーザ項目追加機能を付加 1/7 
		2a 食べ物・飲み物は定価表示、合計金額は税・割引込み1/12
		2b 使用者氏名入力・表示 1/12
		2c 追加メニュー価格は数値で1/12
		追加メニュー削除（-をダブルクリック)時に出るダ駆除しましたのメッセジは不要
		★これでリリースする★
-->
<!-- ロゴマークで送信・ショートカットアイコン -->
<!-- エディターのコードはUTF-8 -->
<!-- ロゴマーク3種とmanifest.jsonは同じディレクトリに置く-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ももの会 新年会 会計</title>

  <!-- iPhone ホーム画面用アイコン -->
  <link rel="apple-touch-icon" href="icon-180.png">

  <!-- Android / Chrome 用 -->
  <link rel="manifest" href="manifest.json">

  <!-- PWA 表示調整（iPhone） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ももの会">

  <!-- PWA 表示調整（Android） -->
  <meta name="theme-color" content="#ffffff">

  <!-- Vue.js -->
  <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>

<style>
  body {
    font-family:
      "Hiragino Kaku Gothic ProN",
      "Hiragino Sans",
      "Noto Sans JP",
      "Yu Gothic",
      "Meiryo",
      sans-serif;
    margin: 8px;
    font-size: 16px;
  }

  .title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .title-text {
    font-size: 20px;
    font-weight: bold;
  }

  .title-logo {
    height: 28px;
  }

  .total {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 6px;
  }

  .note {
    margin-bottom: 6px;
  }

  .note-food {
    font-size: 18px;
    font-weight: bold;
  }

  .note-desc {
    font-size: 13px;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 6px;
    border-bottom: 1px solid #ddd;
    padding: 4px 0;
  }

  .first-drink {
    border-top: 1px solid #999;
    margin-top: 6px;
    padding-top: 6px;
  }

  .name {
    flex: 1;
    font-size: 15px;
  }

  .price {
    width: 60px;
    text-align: right;
    font-size: 14px;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  button {
    width: 44px;
    height: 36px;
    font-size: 20px;
    border: none;
    border-radius: 6px;
  }

  .add { background: #4CAF50; color: #fff; }
  .remove { background: #f44336; color: #fff; }

  .qty {
    width: 28px;
    text-align: center;
    font-size: 16px;
  }

  .delete-info {
    margin-top: 6px;
    font-size: 14px;
    color: #c62828;
    display: flex;
    gap: 8px;
    align-items: center;
  }
</style>
</head>

<body>
<div id="app">

<div class="title">
  <span class="title-text">ももの会 新年会 会計システム</span>
  <img src="ももアイコン.png" class="title-logo">
</div>
<!-- 名前入力欄（2行目） -->
  <div class="note">
    <label>
      お名前：
      <input
        v-model="userName"
        placeholder="氏名"
        style="width:160px; font-size:18px;"
      >
    </label>
  </div>

<div class="total">◆会費合計(税・割引込)：{{ Math.round((2251+total)*1.045) }} 円</div>

<div class="note">
  <span class="note-food">食べ物(定価)：2251円</span>
  <span class="note-desc">（豆腐豚チゲ鍋＋つまみ6品）</span>
</div>

<div class="note">
  <span class="note-food">飲み物(定価)：{{ total }}円</span>
  <span class="note-desc">（下のメニューから追加）</span>
</div>

<div
  class="item"
  :class="{ 'first-drink': item.name === '飲み放題' }"
  v-for="item in items"
  :key="item.name"
  
>
  <div class="name">{{ item.name }}</div>
  <div class="price">{{ item.price }}円</div>
  <div class="controls">
    <button class="remove" @click="remove(item)">－</button>
    <div class="qty">{{ item.qty }}</div>
    <button class="add" @click="add(item)">＋</button>
  </div>
</div>

<!-- ユーザ追加 -->
<div class="note">
  <input v-model="newName" placeholder="追加メニュー" style="width:120px">
  <input v-model="newPrice" placeholder="価格" inputmode="numeric" style="width:80px">
  <button @click="addCustom" style="width:80px">追加</button>
</div>

<!-- 削除メッセージ -->
<div class="delete-info" v-if="message">
  <span>{{ message }}</span>
  <button v-if="canUndo" @click="undoDelete">削除を元に戻す</button>
</div>

</div>

<audio id="clickSound" preload="auto">
  <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=">
</audio>

<script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
<script>
new Vue({
  el: "#app",
  data: {
    base: 0,
    items: [
      { name: "飲み放題", price: 1500, qty: 0, custom: false },
      { name: "ドリンクバー", price: 363, qty: 0, custom: false },
      { name: "生ビール(*割引)", price: 299, qty: 0, custom: false },
      { name: "日本酒(*割引)", price: 249, qty: 0, custom: false },
      { name: "ノンアルビール", price: 299, qty: 0, custom: false },
	  { name: "梅酒・サワー", price: 349, qty: 0, custom: false },
      { name: "抹茶ﾊｲ・生絞りﾚﾓﾝｻﾜｰ", price: 399, qty: 0, custom: false },	
      { name: "ワイン", price: 200, qty: 0, custom: false }
    ],
    newName: "",
    newPrice: "",
    message: "",
    pendingDelete: null,
    lastDeleted: null,
    timer: null
  },
  computed: {
    total() {
      return this.base + this.items.reduce(
        (sum, i) => sum + i.price * i.qty, 0
      );
    },
    canUndo() {
      return this.lastDeleted !== null;
    }
  },
  methods: {
    click() {
      const s = document.getElementById("clickSound");
      s.currentTime = 0; s.play();
    },
    showMessage(msg, undo=false) {
      clearTimeout(this.timer);
      this.message = msg;
      if (!undo) this.lastDeleted = null;
      this.timer = setTimeout(() => {
        this.message = "";
        this.lastDeleted = null;
        this.pendingDelete = null;
      }, 3000);
    },
    add(item) {
      item.qty++;
      this.pendingDelete = null;
    },
    remove(item) {
      this.click();
      if (!item.custom) {
        if (item.qty > 0) item.qty--;
        return;
      }
      if (item.qty > 0) {
        item.qty--;
        return;
      }
      if (this.pendingDelete !== item) {
        this.pendingDelete = item;
        this.showMessage("削除します");
      } else {
        this.lastDeleted = item;
        this.items = this.items.filter(i => i !== item);
        this.showMessage("", true);
      }
    },
	 addCustom() {
	  const price = Number(this.newPrice);
	  if (!this.newName || price <= 0) return;

	  this.items.push({
	    name: this.newName,
	    price: price,
	    qty: 0,
	    custom: true
	  });

	  this.newName = "";
	  this.newPrice = "";
	},
    undoDelete() {
      this.items.push(this.lastDeleted);
      this.lastDeleted = null;
      this.showMessage("削除を取り消しました");
    }
  }
});
</script>
</body>
</html>
